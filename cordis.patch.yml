# dsh-bash-rtk optional overlay: routes eligible shell commands through rtk
# (Rust Token Killer) to compress tool output and save tokens.
#
# The inserted auto assembler is DISABLED by default, so installing the plugin
# has no effect. To enable it, add these lines to your profile's
# cordis.patch.yml (both stock executors must be off and shell-rtk on):
#
#   - id: bash-sandbox
#     disabled: true
#   - id: pwsh-sandbox
#     disabled: true
#   - id: shell-rtk
#     disabled: false
#
# shell-rtk probes pwsh once at startup and mounts the matching family: pwsh
# present runs the pwsh executor, absent falls back to bash. Pin the dialect
# with `preferShell: 'auto' | 'pwsh' | 'bash'` (default: auto).
#
# The mounted executor inherits the sandbox executor's confinement mechanics
# and only rewrites the shell source, so sandbox policy, denial/enforcement
# facts, workdir/timeout/env/exit-code, and background-job semantics are
# unchanged; only eligible commands' output is filtered. Requires the `rtk`
# binary on PATH; without it, every command passes through unchanged.
#
# Confined runs on Windows (read-only / workspace-write) also pass through: the
# restricted token cannot host rtk's piped child spawn, so routing there would
# break the command. Use a danger-full-access run (a one-shot escalation counts)
# when you want rtk on Windows. See docs/adr/0003.
#
# Upgrading from 0.1.x: the `bash-rtk` entry id is gone. Replace that profile
# row with `shell-rtk` (the recipe above is otherwise unchanged).

- insert:
    - id: shell-rtk
      name: '@deeptrial/dsh-bash-rtk/auto'
      disabled: true
      config:
        preferShell: auto
        timeoutMs: 60000
